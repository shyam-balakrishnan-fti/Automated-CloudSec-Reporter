[project]
name = "cloud-security-reporter-gui"
version = "0.1.0"
description = "GUI for the Automated Cloud Security Reporter pipelines"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]

[tool.uv]
