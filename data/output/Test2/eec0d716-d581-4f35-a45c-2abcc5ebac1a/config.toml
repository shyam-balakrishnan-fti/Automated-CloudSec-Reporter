# config.toml — generated by Cloud Security Reporter GUI
# One file. Six sections. Different owners.
# API keys are NEVER stored here — use environment variables.

# ── Engagement (change every run) ──────────────────────────────────
[engagement]
client_name       = 'Test2'
assessment_period = 'July 2026'
analyst           = 'Shyam Balakrishnan'
output_filename   = 'SecurityReport_Test2.xlsx'

# ── LLM (set once at setup) ────────────────────────────────────────
[llm]
provider         = "bedrock_runtime"
deployment_name  =
aws_region       = 'ap-southeast-2'
max_tokens       = 1500
timeout_seconds  = 60

# ── Processing (change occasionally) ──────────────────────────────
[processing]
include_statuses = ["FAIL", "MUTED(FAIL)"]
preserve_passing = false

# ── Severity rules (security lead owns this) ──────────────────────
[severity_rules]
critical      = "High"
high          = "High"
medium        = "Medium"
low           = "Low"
informational = "Low"

likelihood_high_if_categories = ["internet-exposed"]

# ── Risk matrix (security lead owns this) ─────────────────────────
[risk_matrix]
High_Major      = "High"
High_Moderate   = "High"
High_Minor      = "High"
Medium_Major    = "High"
Medium_Moderate = "Medium"
Medium_Minor    = "Medium"
Low_Major       = "Medium"
Low_Moderate    = "Medium"
Low_Minor       = "Low"

# ── Output (reporting owner) ───────────────────────────────────────
[output]
template_path = '/home/shyam-balakrishnan/cloud-tool/templates/Output_Template.xlsx'
ref_prefix    = "AWS"

[output.colours]
High   = "FFFF0000"
Medium = "FFFFC000"
Low    = "FF92D050"
